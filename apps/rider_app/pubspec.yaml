name: rider_app
description: "DeliveryOS Rider Partner Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  sentry_flutter: ^8.14.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_background_service: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.11.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.2
  geolocator: ^13.0.2
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/logo-foreground.png"

flutter_native_splash:
  color: "#1E3A8A"
  image: "assets/logo-foreground.png"
  android_12:
    color: "#1E3A8A"
    image: "assets/logo-foreground.png"
  fullscreen: false
