name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, build, analyze, flutter tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20.18.0
          cache: npm
          cache-dependency-path: |
            services/backend_api/package-lock.json
            apps/admin_portal/package-lock.json
            apps/vendor_portal/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3
          cache: true

      - name: Install backend dependencies + Prisma client
        working-directory: services/backend_api
        run: |
          npm ci
          npx prisma validate
          npx prisma generate

      - name: Install admin portal dependencies
        working-directory: apps/admin_portal
        run: npm ci

      - name: Install vendor portal dependencies
        working-directory: apps/vendor_portal
        run: npm ci

      - name: Run root verify gate
        run: npm run verify

  integration:
    # Live-stack money-path suites (18 chained scripts against Postgres+Redis).
    # Strict blocking merge gate.
    name: Backend Integration Suites (live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: false
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: deliveryos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deliveryos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:secretpassword@localhost:5433/deliveryos?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-integration-jwt-secret-key-32chars-min
      JWT_REFRESH_SECRET: ci-integration-jwt-refresh-secret-32chars
      SMS_PROVIDER: mock
      SMS_MOCK_STATIC_OTP: "123456"
      ALLOW_STATIC_OTP: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20.18.0
          cache: npm
          cache-dependency-path: services/backend_api/package-lock.json

      - name: Install backend dependencies
        working-directory: services/backend_api
        run: |
          npm ci
          npx prisma generate

      - name: Apply migrations + seed
        working-directory: services/backend_api
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Build backend
        working-directory: services/backend_api
        run: npm run build

      - name: Run integration suites (with background API server on :4000)
        working-directory: services/backend_api
        run: |
          node dist/src/main.js &
          API_PID=$!
          echo "Started background API server (PID: $API_PID), polling http://localhost:4000/api/v1/health..."
          
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4000/api/v1/health > /dev/null 2>&1; then
              echo "Backend API is healthy on :4000 (attempt $i)."
              HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ $HEALTHY -ne 1 ]; then
            echo "Backend API failed to become healthy within 30 seconds."
            kill -9 $API_PID || true
            exit 1
          fi

          npm test
          TEST_EXIT_CODE=$?
          kill $API_PID || true
          exit $TEST_EXIT_CODE
