name: deliveryos

# ==============================================================================
# DeliveryOS — Local Multi-Container Docker Compose Topology
# ==============================================================================
# Architecture Overview:
#   1. Ingress Layer:    Nginx Edge Reverse Proxy (Port 8080)
#   2. App Layer:        Backend API (Port 4000), Admin Portal (Port 3000) & Vendor Portal (Port 3001)
#   3. Data Layer:       PostgreSQL 16 + PostGIS 3.4 (Port 5433) & Redis 7.2 (Port 6380)
#
# Secrets (DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET) are
# REQUIRED — they are loaded from the repo-root .env file via:
#   docker compose --env-file ../.env -f docker-compose.yml up -d
# (scripts/start-local.sh does this automatically). The stack fails fast with a
# clear error instead of booting with known default credentials.
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  # ============================================================================
  # LAYER 1: DATA & CACHE INFRASTRUCTURE
  # ============================================================================

  # 1. PostgreSQL 16 with PostGIS 3.4 (Official Image)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: deliveryos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-deliveryos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
    volumes:
      - deliveryos_pgdata:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-deliveryos}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deliveryos_network
    logging: *default-logging

  # 2. Redis 7.2 In-Memory Cache & Real-Time Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: deliveryos_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}
    command: sh -c "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
    volumes:
      - deliveryos_redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deliveryos_network
    logging: *default-logging

  # ============================================================================
  # LAYER 2: APPLICATION SERVICES
  # ============================================================================

  # 3. NestJS Enterprise Core REST & WebSocket API
  backend:
    build:
      context: ../services/backend_api
      dockerfile: Dockerfile
    container_name: deliveryos_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-deliveryos}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars, see .env.example)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required (min 32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      SMS_PROVIDER: mock
      SMS_MOCK_STATIC_OTP: ${SMS_MOCK_STATIC_OTP:-123456}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - deliveryos_network
    logging: *default-logging

  # 4. Super Admin Master Console (React Vite SPA, non-root nginx on 8080)
  admin_portal:
    build:
      context: ../apps/admin_portal
      dockerfile: Dockerfile
    container_name: deliveryos_admin_portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_network
    logging: *default-logging

  # 5. Vendor Store & Kitchen Order Console KDS (React Vite SPA, non-root nginx on 8080)
  vendor_portal:
    build:
      context: ../apps/vendor_portal
      dockerfile: Dockerfile
    container_name: deliveryos_vendor_portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_network
    logging: *default-logging

  # ============================================================================
  # LAYER 3: EDGE INGRESS & REVERSE PROXY
  # ============================================================================

  # 6. Local Nginx Edge Ingress Gateway (Unified Single-Origin Port 8080)
  nginx:
    image: nginx:1.25-alpine
    container_name: deliveryos_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin_portal
      - vendor_portal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_network
    logging: *default-logging

# ==============================================================================
# PERSISTENT STORAGE VOLUMES
# ==============================================================================
volumes:
  deliveryos_pgdata:
    name: deliveryos_pgdata
  deliveryos_redisdata:
    name: deliveryos_redisdata

# ==============================================================================
# ISOLATED BRIDGE NETWORK
# ==============================================================================
networks:
  deliveryos_network:
    name: deliveryos_network
    driver: bridge
