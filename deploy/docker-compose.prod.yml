name: deliveryos-prod

# ==============================================================================
# DeliveryOS — Production Cloud VPS Docker Compose Topology
# ==============================================================================
# Architecture Overview:
#   1. Edge Ingress:     Nginx Reverse Proxy + Let's Encrypt TLS (Ports 80/443)
#   2. Application:      NestJS Production API & React Production SPAs (non-root)
#   3. Data Persistence: PostgreSQL 16 + PostGIS 3.4 & Redis 7.2 In-Memory Cache
#
# REQUIRED environment variables (fail-fast on boot if missing):
#   DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET (min 32 chars), JWT_REFRESH_SECRET,
#   SMS_PROVIDER (must NOT be "mock"), DOMAIN (TLS hostname), ACME_EMAIL
# See deploy/README.md for first-boot TLS issuance and env setup.
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================================
  # LAYER 1: PRODUCTION DATA & CACHE INFRASTRUCTURE
  # ============================================================================

  # 1. PostgreSQL 16 with PostGIS 3.4 (Official Image)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-deliveryos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-deliveryos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - deliveryos_prod_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g

  # 2. Redis 7.2 Cache & Real-Time Pub/Sub
  redis:
    image: redis:7.2-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: sh -c "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
    volumes:
      - prod_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deliveryos_prod_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  # ============================================================================
  # LAYER 2: PRODUCTION APPLICATION SERVICES
  # ============================================================================

  # 3. NestJS Production Core Backend API (applies migrations on boot)
  backend:
    build:
      context: ../services/backend_api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-deliveryos}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required (min 32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER is required in production (must not be "mock")}
      SMS_SSLW_API_TOKEN: ${SMS_SSLW_API_TOKEN:-}
      SMS_SSLW_SID: ${SMS_SSLW_SID:-}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SSLCOMMERZ_BASE_URL: ${SSLCOMMERZ_BASE_URL:-https://sandbox.sslcommerz.com}
      SSLCOMMERZ_CALLBACK_BASE: ${SSLCOMMERZ_CALLBACK_BASE:-https://${DOMAIN}}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:?DOMAIN is required for TLS}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - deliveryos_prod_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  # 4. Super Admin Master Console (React SPA, non-root nginx on 8080)
  admin_portal:
    build:
      context: ../apps/admin_portal
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_prod_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  # 5. Vendor Store & Kitchen Order Console KDS (React SPA, non-root nginx on 8080)
  vendor_portal:
    build:
      context: ../apps/vendor_portal
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_prod_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  # ============================================================================
  # LAYER 3: PRODUCTION EDGE INGRESS & SSL REVERSE PROXY
  # ============================================================================

  # 6. Production Nginx Reverse Proxy with Let's Encrypt SSL
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required for TLS}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for Let's Encrypt}
    volumes:
      - ./nginx-templates:/etc/nginx/templates:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - admin_portal
      - vendor_portal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_prod_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  # 7. Let's Encrypt certificate issuance & renewal (webroot via nginx)
  certbot:
    image: certbot/certbot:latest
    container_name: deliveryos_prod_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --keep; sleep 12h & wait $${!}; done'
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for Let's Encrypt}
    networks:
      - deliveryos_prod_network
    logging: *default-logging

# ==============================================================================
# PRODUCTION PERSISTENT STORAGE VOLUMES
# ==============================================================================
volumes:
  prod_pgdata:
    name: deliveryos_prod_pgdata
  prod_redisdata:
    name: deliveryos_prod_redisdata
  backend_uploads:
  certbot_conf:
  certbot_www:

# ==============================================================================
# PRODUCTION ISOLATED NETWORK
# ==============================================================================
networks:
  deliveryos_prod_network:
    name: deliveryos_prod_network
    driver: bridge
